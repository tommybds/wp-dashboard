# Mise en cache des ressources statiques du front (refonte, phase 1).
#
# À INCLURE DANS LE BLOC server{} de nginx-dashboard.conf, par exemple :
#
#     server {
#         server_name dashboard.example.com;
#         root /opt/wp-dashboard/public;
#         add_header Cache-Control "no-store";
#         auth_request /_authcheck;
#         ...
#         include /opt/wp-dashboard/deploy/nginx-static-cache.conf;
#     }
#
# puis : nginx -t && systemctl reload nginx
#
# ---------------------------------------------------------------------------
# DEUX PIÈGES, deux raisons d'être de ce fichier.
#
# 1. `add_header` dans un location REMPLACE ceux hérités du niveau supérieur.
#    Le vhost pose `add_header Cache-Control "no-store"` au niveau server ;
#    les deux blocs ci-dessous le remplacent donc par un cache d'un an. C'est
#    VOULU : chaque fichier est demandé avec `?v=<horodatage>` posé par
#    tools/deploy.sh, un déploiement change l'URL et invalide le cache tout
#    seul. index.html, lui, n'est pas concerné : il reste en `no-store`, c'est
#    lui qui porte la table d'imports et donc la version courante.
#
# 2. `auth_request` est HÉRITÉ du niveau server. Il reste actif sur le code
#    applicatif (deuxième bloc) : sans directive `auth_request off`, la
#    protection de session vaut aussi pour ces fichiers. Vérifié avec :
#
#        curl -sI https://dashboard.example.com/screens/parc.js | head -1
#        # → HTTP/2 302  (redirection vers /login.html) sans cookie de session
#        curl -sI https://dashboard.example.com/css/tokens.css | head -1
#        # → HTTP/2 200  (présentation, volontairement publique — voir ci-dessous)
#
#    La page de connexion est servie AVANT toute session : si ses feuilles de
#    style et ses polices étaient protégées, elles répondraient 401 → redirection
#    vers /login.html, le navigateur recevrait du HTML à la place du CSS et la
#    page s'afficherait sans mise en forme. css/ et fonts/ sont donc explicitement
#    publics. Ils ne contiennent aucune donnée du parc : des jetons de couleur,
#    des règles de mise en page et des fichiers de police.
# ---------------------------------------------------------------------------

# 1) Présentation — lisible avant la session (la page de connexion en dépend).
location ~* ^/(?:css|fonts)/|^/favicon\.(?:svg|ico)$ {
    auth_request off;
    add_header Cache-Control "public, max-age=31536000, immutable";
    access_log off;
}

# 2) Code applicatif et sprite d'icônes — derrière la session, comme le reste.
location ~* ^/(?:lib|components|screens)/|^/(?:app|version)\.js$|^/icons\.svg$ {
    auth_request /_authcheck;
    add_header Cache-Control "public, max-age=31536000, immutable";
}

# Compression : sans elle, les modules partent en clair (330 Ko bruts, 109 Ko
# gzippés). À poser dans le http{} de nginx.conf, une fois pour toutes :
#
#     gzip on;
#     gzip_vary on;
#     gzip_min_length 1024;
#     gzip_types text/css application/javascript image/svg+xml application/json;
#
# Les .woff2 sont déjà compressés : ne pas les ajouter à gzip_types.
