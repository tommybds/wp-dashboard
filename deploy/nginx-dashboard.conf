# Modèle de vhost nginx pour le dashboard.
# Remplacez dashboard.example.com par votre domaine, puis obtenez un certificat
# (certbot --nginx -d dashboard.example.com).
#
# PRÉREQUIS — ajoutez cette ligne dans le bloc http{} de /etc/nginx/nginx.conf
# (elle définit la zone de limitation de débit utilisée plus bas) :
#
#     limit_req_zone $binary_remote_addr zone=dashlogin:10m rate=5r/s;
#
# et copiez deploy/nginx-log-sansargs.conf dans /etc/nginx/conf.d/.

server {
    server_name dashboard.example.com;
    root /opt/wp-dashboard/public;
    index index.html;
    add_header Cache-Control "no-store";

    # Vérification de session pour tout le reste (redirige vers la page de login).
    auth_request /_authcheck;
    error_page 401 = @tologin;
    location @tologin { return 302 /login.html; }
    location = /_authcheck {
        internal;
        proxy_pass http://127.0.0.1:8090/api/auth/check;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header X-Original-URI $request_uri;
    }

    # Page de login et endpoint de login : publics.
    location = /login.html { auth_request off; }
    location = /api/auth/login {
        auth_request off;
        limit_req zone=dashlogin burst=5 nodelay;
        proxy_pass http://127.0.0.1:8090;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
    location = /api/auth/logout { auth_request off; proxy_pass http://127.0.0.1:8090; proxy_set_header Host $host; }

    # Ingestion des évènements des sites : public, authentifié par HMAC dans l'application.
    location = /api/ingest {
        auth_request off;
        limit_req zone=dashlogin burst=20 nodelay;
        client_max_body_size 32k;
        proxy_pass http://127.0.0.1:8090;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Appairage d'un nouveau site : public, protégé par un code à usage unique + TTL.
    location = /api/pair {
        auth_request off;
        limit_req zone=dashlogin burst=10 nodelay;
        client_max_body_size 8k;
        proxy_pass http://127.0.0.1:8090;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Retour du flux d'autorisation WordPress : journalisé SANS la chaîne de
    # requête (elle contient le mot de passe d'application). Reste protégé par
    # la session du dashboard + le jeton state à usage unique.
    location = /api/wp_callback {
        access_log /var/log/nginx/access.log sansargs;
        proxy_pass http://127.0.0.1:8090;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # API applicative (routes authentifiées par la session).
    location ~ ^/api/(actions|mgmt|sec|auth|site)/|^/api/incidents$ {
        proxy_pass http://127.0.0.1:8090;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 340;
    }

    # Statut live d'Uptime Kuma (proxifié même origine ; l'en-tête Authorization
    # est retiré pour ne pas fuiter la session Kuma). Doit rester APRÈS le bloc
    # applicatif ci-dessus, sinon il capte /api/mgmt, /api/sec, etc.
    location /api/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Authorization "";
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    listen [::]:443 ssl ipv6only=on;
    listen 443 ssl;
    # Lignes ssl_certificate / include / ssl_dhparam ajoutées par certbot.
}

server {
    if ($host = dashboard.example.com) { return 301 https://$host$request_uri; }
    listen 80;
    listen [::]:80;
    server_name dashboard.example.com;
    return 404;
}
