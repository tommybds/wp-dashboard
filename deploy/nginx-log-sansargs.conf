# /etc/nginx/conf.d/log-sansargs.conf
# Journal SANS la chaîne de requête ($uri au lieu de $request) : le flux
# d'autorisation WordPress renvoie le mot de passe d'application en paramètre
# d'URL, il ne doit jamais atterrir dans les logs.
log_format sansargs '$remote_addr - $remote_user [$time_local] "$request_method $uri $server_protocol" $status $body_bytes_sent "$http_referer" "$http_user_agent"';
