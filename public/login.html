<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Connexion — Parc WordPress</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%A7%A9%3C/text%3E%3C/svg%3E">
<style>
:root{ --bg:#f4f6f8; --card:#fff; --fg:#16212b; --line:#e2e8ee; --muted:#64748b; --accent:#2563eb; --err:#dc2626; --err-bg:#fdeaea; --shadow:0 4px 24px rgba(15,30,50,.12); }
@media (prefers-color-scheme: dark){ :root{ --bg:#0e1419; --card:#161d24; --fg:#dce5ed; --line:#232d37; --muted:#8494a3; --accent:#60a5fa; --err:#f87171; --err-bg:#301717; --shadow:0 4px 24px rgba(0,0,0,.5); } }
*{box-sizing:border-box}
body{margin:0;height:100vh;display:flex;align-items:center;justify-content:center;background:var(--bg);color:var(--fg);font:14px/1.5 -apple-system,"Segoe UI",Roboto,sans-serif}
.box{background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:32px 30px;width:340px;max-width:92vw}
h1{font-size:20px;margin:0 0 4px;text-align:center}
p.sub{color:var(--muted);text-align:center;margin:0 0 22px;font-size:13px}
label{display:block;font-size:12.5px;color:var(--muted);margin:12px 0 4px}
input{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:9px;background:var(--bg);color:var(--fg);font:inherit}
input:focus{outline:2px solid var(--accent);border-color:var(--accent)}
button{width:100%;margin-top:20px;padding:11px;border:none;border-radius:9px;background:var(--accent);color:#fff;font:inherit;font-weight:600;cursor:pointer}
button:disabled{opacity:.6;cursor:default}
.err{background:var(--err-bg);color:var(--err);border-radius:8px;padding:9px 12px;font-size:13px;margin-top:14px;display:none}
</style>
</head>
<body>
<form class="box" id="f">
  <h1>🧩 Parc WordPress</h1>
  <p class="sub">Connexion au tableau de bord</p>
  <label for="u">Utilisateur</label>
  <input id="u" autocomplete="username" autofocus>
  <label for="p">Mot de passe</label>
  <input id="p" type="password" autocomplete="current-password">
  <button id="b" type="submit">Se connecter</button>
  <div class="err" id="e"></div>
</form>
<script>
const f=document.getElementById('f'), b=document.getElementById('b'), e=document.getElementById('e');
f.onsubmit=async ev=>{ ev.preventDefault(); b.disabled=true; b.textContent='…'; e.style.display='none';
  try{ const r=await fetch('/api/auth/login',{method:'POST',headers:{'Content-Type':'application/json','X-Dash':'1'},
      body:JSON.stringify({user:document.getElementById('u').value,password:document.getElementById('p').value})});
    if(r.ok){ location.href='/'; return; }
    const j=await r.json().catch(()=>({})); e.textContent=j.error||'Échec de la connexion'; e.style.display='block';
  }catch(err){ e.textContent='Erreur réseau'; e.style.display='block'; }
  b.disabled=false; b.textContent='Se connecter'; };
</script>
</body>
</html>
