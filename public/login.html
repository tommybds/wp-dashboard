<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Connexion — Parc WordPress</title>
<link rel="icon" href="/favicon.svg">
<!-- Cette page est servie AVANT la session : elle ne peut dépendre que des
     ressources laissées publiques par le vhost (css/ et fonts/, qui ne
     contiennent aucun secret — voir deploy/nginx-static-cache.conf). Elle
     n'utilise ni module ES, ni sprite d'icônes, ni appel d'API authentifié. -->
<link rel="preload" as="font" type="font/woff2" href="fonts/plex-sans-latin.woff2" crossorigin>
<link rel="preload" as="font" type="font/woff2" href="fonts/archivo-latin.woff2" crossorigin>
<link rel="stylesheet" href="css/tokens.css?v=2026-09-03-0942">
<link rel="stylesheet" href="css/base.css?v=2026-09-03-0942">
<style>
body{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:var(--s-24)}
.box{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-surf);
  box-shadow:var(--shadow-1);padding:var(--s-32) var(--s-24);width:340px;max-width:100%}
.box h1{font-size:var(--t-20);margin:0 0 var(--s-4);text-align:center}
.box p.sub{color:var(--muted);text-align:center;margin:0 0 var(--s-24);font-size:var(--t-13)}
.box label{display:block;font-size:var(--t-12);color:var(--muted);margin:var(--s-12) 0 var(--s-4)}
.box input{width:100%;padding:9px var(--s-12);border:1px solid var(--line);border-radius:var(--r-ctl);
  background:var(--page);color:var(--ink);font:inherit}
.box input:focus{border-color:var(--accent)}
.box button{width:100%;margin-top:var(--s-24);padding:10px;border:1px solid var(--accent);
  border-radius:var(--r-ctl);background:var(--accent);color:var(--on-accent);
  font:inherit;font-weight:600;cursor:pointer}
.box button:hover{background:var(--accent-ink);border-color:var(--accent-ink)}
.box button:disabled{opacity:.6;cursor:default}
.err{background:var(--err-bg);color:var(--err);border-radius:var(--r-ctl);
  padding:9px var(--s-12);font-size:var(--t-13);margin-top:var(--s-12)}
.err[hidden]{display:none}
</style>
</head>
<body>
<form class="box" id="f">
  <h1>Parc WordPress</h1>
  <p class="sub">Connexion au tableau de bord</p>
  <label for="u">Utilisateur</label>
  <input id="u" autocomplete="username" autofocus>
  <label for="p">Mot de passe</label>
  <input id="p" type="password" autocomplete="current-password">
  <button id="b" type="submit">Se connecter</button>
  <div class="err" id="e" role="alert" aria-live="polite" hidden></div>
</form>
<script>
const f=document.getElementById('f'), b=document.getElementById('b'), e=document.getElementById('e');
f.onsubmit=async ev=>{ ev.preventDefault(); b.disabled=true; b.textContent='…'; e.hidden=true;
  try{ const r=await fetch('/api/auth/login',{method:'POST',headers:{'Content-Type':'application/json','X-Dash':'1'},
      body:JSON.stringify({user:document.getElementById('u').value,password:document.getElementById('p').value})});
    if(r.ok){ location.href='/'; return; }
    const j=await r.json().catch(()=>({})); e.textContent=j.error||'Échec de la connexion'; e.hidden=false;
  }catch(err){ e.textContent='Erreur réseau'; e.hidden=false; }
  b.disabled=false; b.textContent='Se connecter'; };
</script>
</body>
</html>
